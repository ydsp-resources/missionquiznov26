<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050B1A">
<title>Mission Quiz</title>
<link rel="stylesheet" href="style.css">
<style>
html{font-size:16px}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{min-height:100dvh;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;font-family:Silkscreen,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);gap:8px;min-height:28px}
.top .me{color:var(--text);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sc{color:var(--orange)}
.v{display:none;flex:1;flex-direction:column}
.v.on{display:flex}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
h1{font-family:Tektur,sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.code{font-family:Silkscreen,monospace;letter-spacing:.14em;color:var(--orange);font-size:13px;text-transform:uppercase}
/* join */
#vJoin h1{font-size:44px}
#vJoin h1 span{display:block;color:var(--blue);font-size:.6em;margin-top:6px}
.jf{width:100%;max-width:360px;padding:20px;display:flex;flex-direction:column;gap:12px;margin-top:10px}
.jf label{font-family:Silkscreen,monospace;font-size:11px;letter-spacing:.16em;color:var(--muted);text-align:left;text-transform:uppercase}
.jf input{font-family:Tektur,sans-serif;font-weight:500;font-size:24px;letter-spacing:.04em;padding:12px;background:rgba(5,11,26,.9);border:1px solid var(--blue);outline:none;text-align:center;user-select:text;-webkit-user-select:text;border-radius:0}
.jf input:focus{border-color:var(--orange)}
.jf .btn{font-size:18px;padding:14px}
.err{color:#FF9A9D;min-height:1.4em;font-size:14px}
/* wait */
.big{font-family:Tektur,sans-serif;font-weight:500;font-size:30px;text-transform:uppercase;letter-spacing:.04em;line-height:1.1;word-break:break-word}
.sub{color:var(--muted);font-size:16px}
.radar{width:120px;height:120px;border-radius:50%;border:1px solid rgba(47,123,255,.5);position:relative;overflow:hidden;background:radial-gradient(circle,rgba(47,123,255,.12) 0 30%,transparent 31%),radial-gradient(circle,transparent 0 60%,rgba(47,123,255,.25) 61% 62%,transparent 63%)}
.radar::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(47,123,255,.55),transparent 25%);animation:spin 2.4s linear infinite;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
/* question */
.qbar{display:flex;align-items:center;gap:10px;margin:10px 0}
.qbar .n{font-family:Silkscreen,monospace;font-size:12px;letter-spacing:.14em;color:var(--orange)}
.qbar .track{flex:1;height:6px;background:rgba(47,123,255,.2);overflow:hidden}
.qbar .fill{height:100%;background:var(--orange);transform-origin:left;will-change:transform}
.qbar .s{font-family:Tektur,sans-serif;font-weight:500;font-size:22px;width:2.2em;text-align:right}
.qt{font-family:Outfit,sans-serif;font-weight:700;font-size:18px;line-height:1.3;padding:12px 14px;margin-bottom:12px}
.opts{flex:1;display:grid;gap:10px;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;min-height:260px}
.opts.two{grid-template-columns:1fr}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;background:var(--c);color:var(--ink);font-family:Outfit,sans-serif;font-weight:700;font-size:16px;line-height:1.2;text-align:center;touch-action:manipulation;transition:transform .08s,opacity .2s}
.opt .shape{width:38px;height:38px}
.opt:active{transform:scale(.96)}
.opts.done .opt{opacity:.25}
.opts.done .opt.pick{opacity:1;box-shadow:0 0 0 4px #fff inset}
/* result */
.res{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;margin:0 -16px;padding:20px}
.res.ok{background:linear-gradient(180deg,rgba(46,204,143,.35),rgba(46,204,143,.05))}
.res.bad{background:linear-gradient(180deg,rgba(255,90,95,.32),rgba(255,90,95,.04))}
.res.none{background:linear-gradient(180deg,rgba(143,163,199,.25),rgba(143,163,199,.03))}
.res .icon{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:54px;font-weight:700;border:3px solid currentColor}
.res.ok .icon{color:var(--ok)}.res.bad .icon{color:var(--bad)}.res.none .icon{color:var(--muted)}
.res .big{font-size:36px}
.pts{font-family:Tektur,sans-serif;font-weight:500;font-size:28px;color:var(--orange)}
.pill{font-family:Silkscreen,monospace;font-size:12px;letter-spacing:.12em;padding:8px 14px;border:1px solid var(--line);background:rgba(5,11,26,.7);text-transform:uppercase}
.rank{font-family:Tektur,sans-serif;font-weight:500;font-size:64px;line-height:1;color:var(--orange)}
.conn{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);background:rgba(255,90,95,.18);border:1px solid var(--bad);color:#FFC2C4;font-size:13px;padding:6px 12px;z-index:9}
</style>
</head><body>
<div class="app">
  <div class="top"><span class="me" id="me">YDSP · Mission Quiz</span><span class="sc" id="sc"></span></div>

  <section class="v on" id="vJoin"><div class="center">
    <div class="code">// YDSP · Space Robotics</div>
    <h1 id="jt">Mission<span>Quiz</span></h1>
    <form class="frame jf" id="jf">
      <label for="nick">Your nickname</label>
      <input id="nick" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="e.g. Rover Rae" enterkeyhint="go">
      <div class="err" id="jerr"></div>
      <button class="btn solid">Join ▸</button>
    </form>
  </div></section>

  <section class="v" id="vWait"><div class="center">
    <div class="radar"></div>
    <div class="code" id="wc">You're in</div>
    <div class="big" id="wn"></div>
    <div class="sub" id="ws">See your name on the big screen. The mission starts soon.</div>
  </div></section>

  <section class="v" id="vQ">
    <div class="qbar"><span class="n" id="qn"></span><div class="track"><div class="fill" id="fill"></div></div><span class="s" id="qs"></span></div>
    <div class="frame qt" id="qt"></div>
    <div class="opts" id="opts"></div>
  </section>

  <section class="v" id="vR"><div class="res" id="res"></div></section>

  <section class="v" id="vEnd"><div class="center">
    <div class="code">// Mission complete</div>
    <div class="sub">You finished</div>
    <div class="rank" id="erank"></div>
    <div class="pts" id="epts"></div>
    <div class="pill" id="emsg"></div>
  </div></section>

  <section class="v" id="vKicked"><div class="center">
    <div class="big">You've been removed</div>
    <div class="sub">Ask your facilitator, then join again.</div>
    <button class="btn go" id="rejoin">Rejoin</button>
  </div></section>
</div>
<div class="conn" id="conn" hidden>Reconnecting…</div>


<script src="config.js"></script>
<script src="rt.js"></script>
<script src="common.js"></script>
<script src="play.js"></script>
</body></html>
